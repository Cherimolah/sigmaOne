<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="assets/styles1.css" rel="stylesheet">
</head>
<body>

<div class="root">
    <div class="table">
        <div class="top-level">
            <div class="arrow">

            </div>
            <div class="hand">

            </div>
        </div>
        <div class="mid-level">
            <div class="deck">
                <div class="cards">
                    <div class="trump-card" id="trump-card">

                    </div>
                    <div class="back">

                    </div>
                </div>
                <div class="count">

                </div>
            </div>
            <div class="bat">

            </div>
        </div>
        <div class="bottom-level">
            <div class="arrow">

            </div>
            <div class="hand">

            </div>
        </div>
    </div>
    <div class="setup">
        <div class="start-buttons" id="start-buttons">
                <div class="start-button" onclick="setup_pve_game()">
                    <button>
                    Играть против ИИ
                    </button>
                </div>
                <div class="start-button">
                    <button>
                    Подсказки от ИИ
                    </button>
                </div>
            </div>
            <div class="setup-buttons" id="setup-buttons">
                <form>
                    <label for="type-select">Тип игры</label>
                    <select id="type-select">
                        <option value="transferable">Переводной</option>
                        <option value="non-transferable">Подкидной</option>
                    </select>
                </form>
                <form>
                    <label>Количество карт
                        <select id="count-cards-select">
                            <option value="24">24</option>
                            <option value="36">36</option>
                            <option value="52">52</option>
                        </select>
                    </label>
                </form>
                <button id="start-game" onclick="start_pve_game()">
                    Начать игру
                </button>
            </div>
    </div>
    <div class="deck-all" style="display: none">

    </div>
</div>

</body>

<script>

function setup_pve_game() {
    let start_buttons = document.getElementById("start-buttons")
    start_buttons.style.display = "none"
    let setup_buttons = document.getElementById("setup-buttons")
    setup_buttons.style.display = "block"
}

function start_pve_game() {
    let type_game = document.getElementById("type-select")
    let count_cards_select = document.getElementById("count-cards-select")
    fetch("/create_game", {method: "POST", body: JSON.stringify(
            {
                deck_size: parseInt(count_cards_select.value),
                transferable: type_game.value === "transferable"
            }
        ), headers: {
        "Content-Type": "application/json"
        }})
        .then(async r => load_game(await r.json()))
    let buttons = document.getElementById("setup-buttons")
    buttons.style.display = "none"
    let deck_div = document.getElementById("deck-div")
    deck_div.style.display = "flex"
}

function sortingCards(data) {
    return (x, y) => {
        if (x.suit === data.trump.suit) {
            x.order_suit = 5
        }
        else {
            x.order_suit = x.suit
        }
        if (y.suit === data.trump.suit) {
            y.order_suit = 5
        }
        else {
            y.order_suit = y.suit
        }
        if (x.order_suit > y.order_suit) {
            return 1
        }
        if (x.order_suit === y.order_suit) {
            if (x.number > y.number) {
                return 1
            }
            return -1
        }
        return -1
    }
}

function load_game(data) {
    alert("dsfsdf")
    data.opponent_cards = data.opponent_cards.sort(sortingCards(data))
    data.player_cards = data.player_cards.sort(sortingCards(data))
    let count_cards = document.getElementById("count")
    count_cards.innerHTML = data.deck.length
    let opponent_cards = document.getElementById("opponent-cards")
    data.opponent_cards.forEach(card => {
        let card_elem = document.createElement("img")
        card_elem.src = `/assets/cards/${card.suit}_${card.number}.png`
        card_elem.style = "padding: 15px"
        opponent_cards.appendChild(card_elem)
    })
    let player_cards = document.getElementById("player-cards")
    data.player_cards.forEach(card => {
        let card_elem = document.createElement("img")
        card_elem.src = `/assets/cards/${card.suit}_${card.number}.png`
        card_elem.style = "padding: 15px"
        player_cards.appendChild(card_elem)
    })
    alert("gggg")
    let trump_card = document.getElementById("trump-card")
    let trump_img = document.createElement("img")
    trump_img.src = `/assets/cards/${data.trump.suit}_${data.trump.number}.png`
    trump_img.style = "rotate: 90deg"
    trump_card.appendChild(trump_img)
    data.deck.forEach(card => {
        let card_cell = document.getElementById(`card-${card.suit}-${card.number}`)
        card_cell.style.visibility = 'visible'
    })
    let deck_all = document.getElementById("deck-all")
    let colgroup = document.createElement("colgroup")
    for (let i = 0; i < data.trump.suit; i++) {
        let col = document.createElement("col")
        colgroup.appendChild(col)
    }
    let col = document.createElement("col")
    col.className = "outlined"
    colgroup.appendChild(col)
    deck_all.appendChild(colgroup)
    if (data.step === 0) {
        let arrow = document.getElementById("player-step-arrow")
        arrow.style.visibility = "visible"
    }
    else {
        let arrow = document.getElementById("opponent-step-arrow")
        arrow.style.visibility = "visible"
    }
}

</script>

</html>
